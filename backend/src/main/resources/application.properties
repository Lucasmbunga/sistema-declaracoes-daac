spring.application.name=daac-backend


# CONFIGURAÇÃO GERAL DO SERVIDOR E API

server.servlet.context-path=/api/v1

# BASE DE DADOS MYSQL (PRODUÇÃO)

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/${DB_NAME:daac_db}?useSSL=true&serverTimezone=Africa/Luanda&allowPublicKeyRetrieval=false&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Otimização do HikariCP (Connection Pool para alta concorrência)

spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1200000

# HIBERNATE / JPA

# NUNCA usar 'update' ou 'create' em produção! 'validate' apenas verifica a estrutura.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# FLYWAY MIGRATIONS

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# UPLOAD DE FICHEIROS

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# SEGURANÇA E JWT (VARIÁVEIS INJETADAS PELO SERVIDOR)

jwt.secret=${JWT_SECRET_KEY:chaveSecretaSuperSeguraParaProducaoMudarImediatamente2026}
jwt.expiration=86400000

# Define o endpoint onde a documentação OpenAPI (Swagger) estará disponível
springdoc.api-docs.path=/api-docs  

# Define a versão do OpenAPI usada na documentação
springdoc.api-docs.version=openapi_3_1  

# Habilita a interface do Swagger UI
springdoc.swagger-ui.enabled=true  

# Define o caminho da interface gráfica do Swagger UI
springdoc.swagger-ui.path=swagger-ui.html  

# Ordena as operações na interface do Swagger UI pelo método HTTP (GET, POST, etc.)
springdoc.swagger-ui.operationsSorter=method  

# Ordena as tags alfabeticamente na interface do Swagger UI
springdoc.swagger-ui.tagsSorter=alpha  

# Garante que os cabeçalhos HTTP sejam corretamente repassados quando o app está atrás de um proxy reverso (ex: Nginx, Kubernetes)
server.forward-headers-strategy=framework  

# ARMAZENAMENTO CLOUDFLARE R2 (COMPATÍVEL COM S3)

cloudflare.r2.account-id=${CLOUDFLARE_R2_ACCOUNT_ID}
cloudflare.r2.access-key=${CLOUDFLARE_R2_ACCESS_KEY}
cloudflare.r2.secret-key=${CLOUDFLARE_R2_SECRET_KEY}
cloudflare.r2.bucket-name=${CLOUDFLARE_R2_BUCKET_NAME}
cloudflare.r2.public-url=${CLOUDFLARE_R2_PUBLIC_URL}
cloudflare.r2.endpoint=https://${CLOUDFLARE_R2_ACCOUNT_ID}.r2.cloudflarestorage.com

